name: E2E Tests (ovoscope)

on:
  pull_request:
    branches: [dev]
    paths:
      - 'nebulento/**'
      - 'test/test_ovoscope_e2e.py'
      - '.github/workflows/ovoscope.yml'
  workflow_dispatch:

jobs:
  e2e:
    uses: OpenVoiceOS/gh-automations/.github/workflows/ovoscope.yml@dev
    with:
      install_extras: "test"
      test_path: "test/test_ovoscope_e2e.py"
