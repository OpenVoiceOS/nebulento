name: Benchmark

on:
  pull_request:
    branches: [dev]
    paths:
      - 'nebulento/**'
      - 'benchmark/**'
      - 'test/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq swig libfann-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e ".[test,benchmark]"

      - name: Run benchmark
        id: bench
        continue-on-error: true
        run: |
          {
            echo "## Benchmark — \`nebulento\`"
            echo ""
            python benchmark/compare.py --ci
          } > ${{ github.workspace }}/benchmark_report.md

      - name: Generate fallback report on crash
        if: steps.bench.outcome == 'failure'
        run: |
          {
            echo "## Benchmark — \`nebulento\`"
            echo ""
            echo "**Status:** FAIL — benchmark crashed before producing a report; see workflow logs."
          } > ${{ github.workspace }}/benchmark_report.md

      - name: Append workflow link
        if: always()
        run: |
          echo "" >> "${{ github.workspace }}/benchmark_report.md"
          echo "_Workflow: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_" >> "${{ github.workspace }}/benchmark_report.md"

      - name: Post / update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark
          path: ${{ github.workspace }}/benchmark_report.md

      - name: Fail job if benchmark failed
        if: steps.bench.outcome == 'failure'
        run: exit 1
